<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fantasy Bot – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-header">Connect Yahoo</div>
            <div class="card-body">
              <p class="text-muted">To use the dashboard, first add your Yahoo API credentials and connect your account.</p>
              <div id="status" class="small text-muted mb-3"></div>
              <form id="loginYahooForm" class="mono mb-3">
                <div class="mb-2">
                  <label class="form-label">Yahoo Client ID</label>
                  <div class="input-group input-group-sm">
                    <input id="loginClientId" type="password" class="form-control form-control-sm" />
                    <button id="toggleLoginClientId" type="button" class="btn btn-outline-secondary">Show</button>
                  </div>
                </div>
                <div class="mb-2">
                  <label class="form-label">Yahoo Client Secret</label>
                  <div class="input-group input-group-sm">
                    <input id="loginClientSecret" type="password" class="form-control form-control-sm" />
                    <button id="toggleLoginSecret" type="button" class="btn btn-outline-secondary">Show</button>
                  </div>
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-sm btn-secondary">Save Yahoo Creds</button>
                  <a id="loginConnectBtn" href="#" class="btn btn-sm btn-primary" aria-disabled="false">Connect Yahoo</a>
                </div>
              </form>
              <div class="small text-muted">After connecting, you’ll be redirected back to the dashboard.</div>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="/" class="text-decoration-none">Back to Dashboard</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      async function fetchJson(url, opts) { const r = await fetch(url, opts); return r.json(); }
      function setBtnEnabled(btn, enabled) {
        if (!btn) return;
        if (enabled) { btn.classList.remove('disabled'); btn.removeAttribute('aria-disabled'); }
        else { btn.classList.add('disabled'); btn.setAttribute('aria-disabled','true'); }
      }
      async function refresh() {
        try {
          const data = await fetchJson('/api/creds');
          const y = data && data.creds && data.creds.yahoo;
          const btn = document.getElementById('loginConnectBtn');
          const st = document.getElementById('status');
          const cid = (document.getElementById('loginClientId')||{}).value || '';
          const csec = (document.getElementById('loginClientSecret')||{}).value || '';
          const canConnect = !!y || (cid && csec);
          setBtnEnabled(btn, canConnect);
          // Populate inputs from stored creds if available and fields empty
          try {
            const raw = await fetchJson('/api/creds/yahoo/raw');
            if (raw && raw.ok) {
              const idEl = document.getElementById('loginClientId');
              const secEl = document.getElementById('loginClientSecret');
              if (idEl && !idEl.value) idEl.value = raw.clientId || '';
              if (secEl && !secEl.value) secEl.value = raw.clientSecret || '';
            }
          } catch {}
          if (st) st.textContent = y ? 'Yahoo creds present. You can connect now.' : 'Enter your Yahoo client ID/secret and click Connect.';
        } catch {}
      }
      document.getElementById('loginYahooForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const clientId = document.getElementById('loginClientId').value || '';
        const clientSecret = document.getElementById('loginClientSecret').value || '';
        try {
          const r = await fetch('/api/creds/yahoo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clientId, clientSecret }) });
          const j = await r.json();
          if (!j.ok) throw new Error(j.error || 'Save failed');
          await refresh();
        } catch (e) { alert('Save failed: ' + (e && e.message ? e.message : String(e))); }
      });
      // Attempt to connect: if creds not saved, save from the text fields, then redirect to OAuth
      document.getElementById('loginConnectBtn')?.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const data = await fetchJson('/api/creds');
          let hasSaved = !!(data && data.creds && data.creds.yahoo);
          if (!hasSaved) {
            const clientId = (document.getElementById('loginClientId')||{}).value || '';
            const clientSecret = (document.getElementById('loginClientSecret')||{}).value || '';
            if (!clientId || !clientSecret) { alert('Enter Yahoo Client ID and Secret first.'); return; }
            const r = await fetch('/api/creds/yahoo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clientId, clientSecret }) });
            const j = await r.json();
            if (!j || j.ok !== true) { alert('Failed to save Yahoo creds: ' + (j && j.error ? j.error : 'unknown')); return; }
          }
          window.location.href = '/auth/yahoo/start';
        } catch (err) {
          alert('Unable to start Yahoo connect: ' + (err && err.message ? err.message : String(err)));
        }
      });
      // Keep connect button enabled state in sync with inputs
      document.getElementById('loginClientId')?.addEventListener('input', refresh);
      document.getElementById('loginClientSecret')?.addEventListener('input', refresh);
      // Toggle visibility of Yahoo Client ID/Secret (login)
      (function(){
        const attach = (btnId, inputId) => {
          const btn = document.getElementById(btnId);
          const inp = document.getElementById(inputId);
          if (btn && inp) {
            btn.addEventListener('click', () => {
              const isPassword = inp.getAttribute('type') === 'password';
              inp.setAttribute('type', isPassword ? 'text' : 'password');
              btn.textContent = isPassword ? 'Hide' : 'Show';
            });
          }
        };
        attach('toggleLoginClientId', 'loginClientId');
        attach('toggleLoginSecret', 'loginClientSecret');
      })();
      refresh();
    </script>
  </body>
  </html>
